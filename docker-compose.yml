# Self-hosted deployment: Next.js app + Cloudflare Tunnel.
#
# 1. cp .env.docker.example .env   # then fill in the values
# 2. docker compose up -d --build
#
# The app is not published on a host port by default — Cloudflare Tunnel
# reaches it over the internal Docker network at http://app:3001.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-patent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-patent_graph}
    volumes:
      - patent-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-patent} -d ${POSTGRES_DB:-patent_graph}"]
      interval: 5s
      timeout: 5s
      retries: 20
    expose:
      - "5432"
    # Loopback only — lets scripts/make-account.mjs and psql run from the host
    # without exposing PostgreSQL beyond this machine.
    ports:
      - "127.0.0.1:5433:5432"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: graph-patent-analysis:latest
    restart: unless-stopped
    environment:
      # Server-side LLM key — read directly from env (no bring-your-own-key UI).
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Signs session cookies. Without it (and DATABASE_URL) the app fails closed.
      AUTH_SECRET: ${AUTH_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-patent}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-patent_graph}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded spreadsheets + JSON snapshots. Analysis data itself is in PG.
      - patent-data:/app/data
    expose:
      - "3001"
    # For direct local access without the tunnel, uncomment:
    # ports:
    #   - "3001:3001"

  # Cloudflare Tunnel — create a tunnel in the Zero Trust dashboard, then map a
  # public hostname to the service http://app:3001 and paste its token below.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - app

volumes:
  patent-data:
  patent-db:
